name: Service regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  service-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test service and direct client calls
        run: python -m unittest discover -s tests -v
